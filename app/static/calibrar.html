<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calibración</title><style>
*{box-sizing:border-box}body{margin:0;padding:14px;font:15px system-ui;color:#1e293b;background:#f8fafc}main{max-width:960px;margin:auto}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}.c{background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}.c small{flex:1}
button{padding:10px;border:0;border-radius:7px;background:#0f2942;color:#fff;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.4}.v{background:#15803d}.r{background:#b91c1c}input[type=number]{width:100%;padding:7px;font:inherit}
#p{background:#0f2942;color:#fff;border-radius:12px;padding:18px;display:flex;gap:18px;align-items:center;min-height:150px}#p.ok{background:#15803d}#p.mal{background:#b91c1c}#t{font-size:19px;font-weight:700;margin-bottom:8px}#b{height:14px;background:#fff3;border-radius:7px;overflow:hidden}#b i{display:block;height:100%;width:0;background:#22c55e}
#d{width:120px;height:120px;flex:none;perspective:300px;display:grid;place-items:center}#d svg{width:100px;transition:transform .6s;transform-style:preserve-3d}#d.gira svg{animation:g 7s linear infinite}@keyframes g{25%{transform:rotateX(90deg)}50%{transform:rotateX(180deg) rotateZ(90deg)}75%{transform:rotateY(90deg)}to{transform:rotateX(360deg) rotateY(360deg)}}
</style></head><body><main><label><input type="checkbox" id="sh"> <b>El dron está SIN HÉLICES y desarmado</b></label>
<div class="g"><div class="c"><b>🧭 Brújula</b><small>Al aire libre, lejos de metal. La girás a mano 1 a 2 min.</small><label><input type="checkbox" id="am"> incluir la interna (hoy desactivada)</label><button data-t="brujula">Calibrar</button></div>
<div class="c"><b>🌀 Giróscopos</b><small>Si dice "Gyros not calibrated". Quieto hasta 30 s.</small><button data-t="giros">Calibrar</button></div>
<div class="c"><b>📐 Nivel</b><small>Si se va solo hacia un lado. Piso nivelado.</small><button data-t="nivel">Calibrar</button></div>
<div class="c"><b>📦 Acelerómetro</b><small>6 posiciones guiadas.</small><button data-t="acelerometro">Calibrar</button></div>
<div class="c"><b>🔋 Voltaje</b><small>Medí la batería con multímetro.</small><input id="vo" type="number" step="0.01" min="9" max="13" placeholder="ej. 12.35"><button data-t="voltaje">Corregir</button></div></div>
<div id="p"><div id="d"><svg viewBox="-50 -50 100 100"><path d="M-27-27L27 27M27-27L-27 27" stroke="#e2e8f0" stroke-width="8"/><path d="M0-26L10-6H-10Z" fill="#ef4444"/><circle r="12" fill="#0ea5e9"/><g fill="none" stroke="#fff" stroke-width="3"><circle cx="-27" cy="-27" r="16"/><circle cx="27" cy="-27" r="16"/><circle cx="27" cy="27" r="16"/><circle cx="-27" cy="27" r="16"/></g></svg></div>
<div style="flex:1"><div id="t">Elegí una calibración.</div><div id="b"><i id="bi"></i></div><div style="margin-top:12px"><button class="v" id="ac" hidden>✓ Guardar</button> <button class="v" id="si" hidden>Siguiente ▶</button> <button class="r" id="ca" hidden>Cancelar</button></div></div></div></main><script>
const $=i=>document.getElementById(i),R={1:'rotateX(60deg)',2:'rotateY(-80deg)',3:'rotateY(80deg)',4:'rotateX(-70deg) rotateZ(180deg)',5:'rotateX(70deg)',6:'rotateX(180deg)'};
async function pide(u,d){const r=await fetch(u,d?{method:'POST',headers:{'Content-Type':'application/json','X-Hormigas':'1'},body:JSON.stringify(d)}:{}),j=await r.json();if(!r.ok)throw Error(j.detail||r.status);return j}
const mal=x=>{$('t').textContent=x.message;$('p').className='mal'};let act=false;
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{try{await pide('/api/calibrar/iniciar',{tipo:b.dataset.t,sin_helices:$('sh').checked,ambas:$('am').checked,voltios:$('vo').value});act=true;ciclo()}catch(x){mal(x)}});
[['ac','aceptar'],['si','siguiente'],['ca','cancelar']].forEach(([i,o])=>$(i).onclick=()=>pide('/api/calibrar/orden',{orden:o}).catch(mal));
async function ciclo(){try{const e=await pide('/api/calibrar/estado');document.querySelectorAll('[data-t]').forEach(b=>b.disabled=e.activo);if(!e.tipo)return;if(!e.activo&&!act&&e.ok===null)return;if(!e.activo&&!act)return;act=e.activo;$('t').textContent=e.texto;$('p').className=e.ok===true?'ok':e.ok===false?'mal':'';$('bi').style.width=e.pct+'%';$('ac').hidden=e.fase!=='confirmar';$('si').hidden=e.fase!=='posicion';$('ca').hidden=!e.activo||!['girar','confirmar','posicion'].includes(e.fase);$('d').className=e.fase==='girar'?'gira':'';$('d').firstChild.style.transform=e.pos?R[e.pos]:''}catch(x){mal(Error('Sin conexión con el programa.'))}}
setInterval(ciclo,400);ciclo();fetch('/api/calibrar/estado').then(r=>r.json()).then(e=>{act=e.activo});
</script></body></html>
