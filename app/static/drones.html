<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vuelos DJI</title><style>
*{box-sizing:border-box}body{margin:0;padding:16px;font:14px system-ui;color:#1e293b;max-width:1100px}fieldset{border:1px solid #cbd5e1;border-radius:6px;margin:0 0 12px}legend{font-weight:700}table{width:100%;border-collapse:collapse}td,th{padding:4px 6px;border-bottom:1px solid #e2e8f0;text-align:left}button{padding:8px 12px;border:0;border-radius:6px;background:#0f2942;color:#fff;font-weight:600;cursor:pointer}button:disabled{opacity:.4}.g{background:#e2e8f0;color:#1e293b}input,select{padding:4px}#ls{max-height:45vh;overflow:auto}progress{width:100%}.e{color:#b91c1c}</style></head><body>
<fieldset><legend>1. Conectar</legend><div id="hw"></div><button class="g" id="rf">Actualizar</button>
<p>Encienda el dron y conéctelo por USB, o copie los MP4, JPG y SRT en <code>datos/entrada_dji/</code>. Nunca se escribe en la tarjeta.</p></fieldset>
<fieldset><legend>2. Elegir vuelos</legend><select id="ta"></select> <button id="le">Buscar vuelos</button><div id="ls"></div></fieldset>
<fieldset><legend>3. Cargar</legend>Nombre <input id="no" value="Vuelo_DJI"> · Una imagen cada <input id="ca" type="number" value="1" min="0" step=".5" style="width:60px"> s de video (0 = ninguna) · <label><input type="checkbox" id="co" checked> guardar también los videos</label> <button id="im" disabled>Cargar vuelos elegidos</button>
<progress id="pg" max="100" value="0"></progress><div id="ms"></div></fieldset><script>
const $=i=>document.getElementById(i);let G=[];
async function pide(u,d){const r=await fetch(u,d?{method:'POST',headers:{'Content-Type':'application/json','X-Hormigas':'1'},body:JSON.stringify(d)}:{}),j=await r.json();if(!r.ok)throw Error(typeof j.detail==='string'?j.detail:'Error '+r.status);return j}
const er=x=>{$('ms').className='e';$('ms').textContent=x.message},fila=(t,c,h)=>{const r=t.insertRow();c.forEach(x=>{const e=document.createElement(h?'th':'td');e.append(x);r.append(e)})};
const bot=()=>{$('im').disabled=!G.some(g=>g.c.checked)};
async function hw(){try{const h=await pide('/api/drones/hardware');$('hw').textContent=h.usb.length?h.usb.map(u=>`${u.tipo}: ${u.nombre}`).join(' · '):'Ningún DJI detectado.';$('ta').replaceChildren(...h.tarjetas.map(t=>new Option(t,t)));$('le').disabled=!h.tarjetas.length}catch(x){er(x)}}
$('rf').onclick=hw;
async function busca(){$('ls').textContent='Leyendo...';try{G=await pide('/api/drones/vuelos?t='+encodeURIComponent($('ta').value));const t=document.createElement('table');fila(t,['','Inicio','Videos','Fotos','Duración','MB','Estado'],true);G.forEach(g=>{g.c=document.createElement('input');g.c.type='checkbox';g.c.disabled=!g.nuevos.length;g.c.checked=!!g.nuevos.length;g.c.onchange=bot;fila(t,[g.c,new Date(g.inicio*1000).toLocaleString(),g.videos,g.fotos,Math.floor(g.seg/60)+':'+String(g.seg%60).padStart(2,'0'),g.mb,g.nuevos.length?(g.nuevos.length<g.archivos.length?g.nuevos.length+' archivos nuevos':'Nuevo'):'Ya cargado'])});$('ls').replaceChildren(t);bot()}catch(x){$('ls').textContent='';er(x)}}
$('le').onclick=busca;
$('im').onclick=async()=>{try{await pide('/api/drones/importar',{tarjeta:$('ta').value,grupos:G.filter(g=>g.c.checked).map(g=>g.nuevos),nombre:$('no').value,cada:+$('ca').value,copiar:$('co').checked});sigue(true)}catch(x){er(x)}};
async function sigue(fin){try{const t=await pide('/api/drones/tarea');$('pg').value=t.pct;$('ms').className=t.error?'e':'';$('ms').textContent=t.msg+(t.msg&&!t.activa&&!t.error?' Véalos en "Vuelos y mapa".':'');if(t.activa){$('im').disabled=true;setTimeout(()=>sigue(true),1000)}else if(fin)busca()}catch(x){er(x)}}
hw();sigue();
</script></body></html>
