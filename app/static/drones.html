<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drones DJI</title><style>
*{box-sizing:border-box}body{margin:0;padding:16px;font:14px system-ui;color:#1e293b;max-width:1100px}fieldset{border:1px solid #cbd5e1;border-radius:6px;margin:0 0 12px}legend{font-weight:700}table{width:100%;border-collapse:collapse}td,th{padding:4px 6px;border-bottom:1px solid #e2e8f0;text-align:left}button{padding:8px 12px;border:0;border-radius:6px;background:#0f2942;color:#fff;font-weight:600;cursor:pointer}button:disabled{opacity:.4}.g{background:#e2e8f0;color:#1e293b}input,select{padding:4px}#ls{max-height:45vh;overflow:auto}progress{width:100%}.e{color:#b91c1c}</style></head><body>
<fieldset><legend>Conectado por USB</legend><div id="hw"></div><button class="g" id="rf">Actualizar</button></fieldset>
<fieldset><legend>Qué permite cada dron</legend><table id="pf"></table></fieldset>
<fieldset><legend>Importar de la cámara del dron (sólo lectura de la tarjeta)</legend><select id="ta"></select> <button class="g" id="le">Leer archivos</button> <button class="g" id="to">Elegir todos / ninguno</button><div id="ls"></div>
Nombre <input id="no" value="DJI_Mini2SE"> · Un fotograma cada <input id="ca" type="number" value="2" min="0" step=".5" style="width:60px"> s (0 = sin fotogramas) · <label><input type="checkbox" id="co" checked> copiar también los videos</label> <button id="im">Importar</button>
<progress id="pg" max="100" value="0"></progress><div id="ms"></div></fieldset><script>
const $=i=>document.getElementById(i);let L=[];
async function pide(u,d){const r=await fetch(u,d?{method:'POST',headers:{'Content-Type':'application/json','X-Hormigas':'1'},body:JSON.stringify(d)}:{}),j=await r.json();if(!r.ok)throw Error(typeof j.detail==='string'?j.detail:'Error '+r.status);return j}
const er=x=>{$('ms').className='e';$('ms').textContent=x.message},fila=(t,c,h)=>{const r=t.insertRow();c.forEach(x=>{const e=document.createElement(h?'th':'td');e.append(x);r.append(e)})};
async function hw(){try{const h=await pide('/api/drones/hardware');$('hw').textContent=h.usb.length?h.usb.map(u=>`${u.tipo}: ${u.nombre} (${u.id})`).join(' · '):'Ningún DJI detectado.';$('ta').replaceChildren(...h.tarjetas.map(t=>new Option(t,t)));$('le').disabled=!h.tarjetas.length}catch(x){er(x)}}
$('rf').onclick=hw;
$('le').onclick=async()=>{$('ls').textContent='Leyendo...';try{L=await pide('/api/drones/medios?t='+encodeURIComponent($('ta').value));const t=document.createElement('table');fila(t,['','Archivo','Hora local','Duración','MB'],true);L.forEach(m=>{const c=document.createElement('input');c.type='checkbox';m.c=c;fila(t,[c,m.archivo,new Date(m.utc*1000).toLocaleString(),m.dur?Math.round(m.dur)+' s':'foto',m.mb])});$('ls').replaceChildren(t)}catch(x){$('ls').textContent='';er(x)}};
$('to').onclick=()=>{const v=!L.every(m=>m.c.checked);L.forEach(m=>m.c.checked=v)};
$('im').onclick=async()=>{try{await pide('/api/drones/importar',{tarjeta:$('ta').value,archivos:L.filter(m=>m.c.checked).map(m=>m.archivo),nombre:$('no').value,cada:+$('ca').value,copiar:$('co').checked});sigue()}catch(x){er(x)}};
async function sigue(){try{const t=await pide('/api/drones/tarea');$('pg').value=t.pct;$('ms').className=t.error?'e':'';$('ms').textContent=t.msg+(t.vuelo?' → '+t.vuelo+' (ver en Vuelos y mapa)':'');$('im').disabled=t.activa;if(t.activa)setTimeout(sigue,1000)}catch(x){er(x)}}
(async()=>{hw();sigue();try{const p=await pide('/api/drones'),C={mavlink:'Carga directa por radio',kmz:'KMZ por DJI Fly',manual:'Sólo guía para vuelo manual'},t=$('pf');fila(t,['Dron','Plan de vuelo','Cámara','Detalle'],true);Object.values(p).forEach(v=>fila(t,[v.nombre,C[v.carga],v.camara,v.nota]))}catch(x){er(x)}})();
</script></body></html>
